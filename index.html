<html>

  <body>
    
<div id="weather-widget" style="font-family: Arial; padding: 10px; border: 1px solid #ccc; width: 250px;">
  <h3>Weather</h3>
  <p id="location">Loading...</p>
  <p id="temp"></p>
  <p id="condition"></p>
</div>
<script>
async function getWeather() {
  try {
    // Step 1: Get IP-based location
    const ipRes = await fetch('https://ipapi.co/json/');
    const ipData = await ipRes.json();
    const { city, region, country, latitude, longitude } = ipData;

    document.getElementById('location').textContent = `${city}, ${region}, ${country}`;

    // Step 2: Fetch weather data
    const apiKey = 'YOUR_OPENWEATHERMAP_API_KEY';
    const weatherRes = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&units=metric&appid=${apiKey}`);
    const weatherData = await weatherRes.json();

    const temp = weatherData.main.temp;
    const condition = weatherData.weather[0].description;

    // Step 3: Display
    document.getElementById('temp').textContent = `Temperature: ${temp}°C`;
    document.getElementById('condition').textContent = `Condition: ${condition}`;
  } catch (error) {
    console.error(error);
    document.getElementById('location').textContent = 'Unable to load weather data.';
  }
}

getWeather();
  // React alternative:

    </div>
  );
};
